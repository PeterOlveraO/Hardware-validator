name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting (prints a patch on failure)
        run: cargo fmt && git diff --exit-code
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Run the inventory and a short CPU test on the runner's hardware
        run: |
          cargo build --release
          ./target/release/hardware-validator
          ./target/release/hardware-validator --verbose
          ./target/release/hardware-validator test cpu --duration 10s --load 30 --allow-no-temperature --verbose

  windows:
    name: Windows (checks the Linux build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy --target x86_64-unknown-linux-gnu
      - name: Type-check and lint the Linux target from Windows
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Native Windows builds are rejected with a clear message
        shell: bash
        run: |
          if cargo check 2> windows-build.log; then
            echo "Expected the Linux-only compile error on Windows"; exit 1
          fi
          grep "supports Linux only" windows-build.log
